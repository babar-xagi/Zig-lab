[project]
name = "zig-jupyter-kernel"
version = "0.7.0"
description = "ZigLab — a native persistent Zig kernel for Jupyter notebooks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "jupyterlab>=4.6.4",
]

[project.scripts]
zig-jupyter-kernel = "zig_jupyter_kernel:main"
ziglab = "zig_jupyter_kernel.cli:main"

[build-system]
requires = [
    "uv_build>=0.12.19,<0.13.0",
]
build-backend = "uv_build"
